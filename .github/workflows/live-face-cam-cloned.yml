name: Live — Face Cam Cloné (diffusion YouTube réelle)

# Diffuse réellement sur YouTube : avatar en PiP + habillage synchronisé
# sur la narration clonée. S'arrête pile quand la narration se termine.
#
# ⚠️ Diffuse pour de vrai — teste d'abord avec le workflow
# "Test — Live Face Cam Cloné" pour vérifier le rendu avant de lancer
# celui-ci. Ne touche à aucun autre workflow/live existant.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installe ffmpeg, Xvfb, et le Chromium du repo (playwright)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb
          npm install
          npx playwright install --with-deps chromium
          pip install --quiet --break-system-packages playwright

      - name: Télécharge la narration clonée (voice_ia) + le minutage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p voice_ia
          gh release download voice_ia --repo "${{ github.repository }}" -D voice_ia -p "*"

      - name: Concatène les morceaux de voix en une seule narration
        run: |
          cd voice_ia
          ls v*.wav | sort > /tmp/concat_order.txt
          : > /tmp/concat_list.txt
          while read -r f; do printf "file '%s'\n" "$PWD/$f" >> /tmp/concat_list.txt; done < /tmp/concat_order.txt
          ffmpeg -y -f concat -safe 0 -i /tmp/concat_list.txt -c copy "$GITHUB_WORKSPACE/additions/facecam/template/narration.wav" -loglevel error
          cd "$GITHUB_WORKSPACE"
          python3 -c "
          import json
          t = json.load(open('voice_ia/narration_timing.json'))
          print(t['total_duration'])
          " > /tmp/total_duration.txt

      - name: Télécharge la vidéo source de l'avatar (release "avatar_source")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/avatar_src
          gh release download avatar_source --repo "${{ github.repository }}" -D /tmp/avatar_src -p "*"

      - name: Fabrique la boucle vidéo de l'avatar (sans couture)
        run: |
          SRC=$(find /tmp/avatar_src -type f | head -1)
          bash additions/facecam/make_loop.sh "$SRC" /tmp/avatar_loop_raw.mp4
          ffmpeg -y -i /tmp/avatar_loop_raw.mp4 -vf scale=512:512 \
            -c:v libvpx-vp9 -b:v 0 -crf 33 -pix_fmt yuv420p -row-mt 1 -an \
            additions/facecam/template/avatar_loop.webm -loglevel error

      - name: Construit content.json (fiches synchronisées sur le vrai minutage)
        run: |
          python3 additions/facecam/build_content.py \
            --scenes additions/facecam/scenes_source.json \
            --timing voice_ia/narration_timing.json \
            --out additions/facecam/template/content.json

      - name: Exporte la durée réelle de la narration (DURATION_SECONDS)
        run: |
          TOTAL=$(cat /tmp/total_duration.txt)
          DURATION_INT=$(python3 -c "print(int(float('$TOTAL')) + 1)")  # arrondi au-dessus
          echo "DURATION_SECONDS=$DURATION_INT" >> "$GITHUB_ENV"
          echo "Durée exportée pour le broadcast : ${DURATION_INT}s"

      # Même mécanisme que le live existant (stream_session.sh / manual-one-off-live.yml) :
      # create_broadcast_now.js crée le broadcast et le lie au flux YouTube
      # PERSISTANT (YOUTUBE_STREAM_ID) — il ne renvoie aucune URL RTMP.
      # L'URL RTMP elle-même est construite ici à partir de YOUTUBE_STREAM_KEY,
      # exactement comme dans stream_session.sh (flux primaire + secours).
      - name: Crée le broadcast YouTube (lié au flux persistant existant)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_STREAM_ID: ${{ secrets.YOUTUBE_STREAM_ID }}
        run: node create_broadcast_now.js

      - name: Diffuse en direct (s'arrête à la fin exacte de la narration)
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          DURATION=$(cat /tmp/total_duration.txt)
          echo "Durée prévue du live : ${DURATION}s"
          bash additions/facecam/capture.sh \
            --template-dir additions/facecam/template \
            --audio additions/facecam/template/narration.wav \
            --duration "$DURATION" \
            --stream-key "$YOUTUBE_STREAM_KEY"

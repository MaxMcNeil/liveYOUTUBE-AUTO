name: Test — Live Face Cam Cloné (aperçu, pas de diffusion)

# Rend l'habillage + l'avatar + la narration clonée en UN FICHIER VIDÉO
# téléchargeable, pour vérifier le résultat avant de lancer le vrai
# live (workflow "Live — Face Cam Cloné"). Ne touche JAMAIS YouTube.
on:
  workflow_dispatch:
    inputs:
      max_duration_seconds:
        description: "Limite de durée du rendu (0 = narration complète). Utile pour un aperçu rapide sans attendre tout le live."
        required: true
        default: "0"

permissions:
  contents: read

jobs:
  render_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installe ffmpeg, Xvfb, et le Chromium du repo (playwright)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb x11-utils
          npm install
          npx playwright install --with-deps chromium
          pip install --quiet --break-system-packages playwright

      - name: Télécharge la narration clonée (voice_ia) + le minutage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p voice_ia
          gh release download voice_ia --repo "${{ github.repository }}" -D voice_ia -p "*"
          ls voice_ia

      - name: Concatène les morceaux de voix en une seule narration
        run: |
          cd voice_ia
          ls v*.wav | sort > /tmp/concat_order.txt
          : > /tmp/concat_list.txt
          while read -r f; do printf "file '%s'\n" "$PWD/$f" >> /tmp/concat_list.txt; done < /tmp/concat_order.txt
          ffmpeg -y -f concat -safe 0 -i /tmp/concat_list.txt -c copy "$GITHUB_WORKSPACE/facecam/template/narration.wav" -loglevel error
          cd "$GITHUB_WORKSPACE"
          python3 -c "
          import json
          t = json.load(open('voice_ia/narration_timing.json'))
          print(t['total_duration'])
          " > /tmp/total_duration.txt
          cat /tmp/total_duration.txt

      - name: Télécharge la vidéo source de l'avatar (release "avatar_source")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/avatar_src
          gh release download avatar_source --repo "${{ github.repository }}" -D /tmp/avatar_src -p "*"
          ls /tmp/avatar_src

      - name: Fabrique la boucle vidéo de l'avatar (sans couture)
        run: |
          SRC=$(find /tmp/avatar_src -type f | head -1)
          bash facecam/make_loop.sh "$SRC" /tmp/avatar_loop_raw.mp4
          ffmpeg -y -i /tmp/avatar_loop_raw.mp4 -vf scale=512:512 \
            -c:v libvpx-vp9 -b:v 0 -crf 33 -pix_fmt yuv420p -row-mt 1 -an \
            facecam/template/avatar_loop.webm -loglevel error

      - name: Construit content.json (fiches synchronisées sur le vrai minutage)
        run: |
          python3 facecam/build_content.py \
            --scenes facecam/scenes_source.json \
            --timing voice_ia/narration_timing.json \
            --out facecam/template/content.json

      - name: Calcule la durée du rendu
        id: dur
        run: |
          TOTAL=$(cat /tmp/total_duration.txt)
          MAX="${{ inputs.max_duration_seconds }}"
          if [ "$MAX" != "0" ]; then
            DUR=$(python3 -c "print(min(float('$TOTAL'), float('$MAX')))")
          else
            DUR="$TOTAL"
          fi
          echo "duration=$DUR" >> "$GITHUB_OUTPUT"
          echo "Durée du rendu : ${DUR}s (narration complète : ${TOTAL}s)"

      - name: Rend la vidéo complète (capture réelle, synchronisée)
        run: |
          bash facecam/capture.sh \
            --template-dir facecam/template \
            --audio facecam/template/narration.wav \
            --duration "${{ steps.dur.outputs.duration }}" \
            --out apercu_live_face_cam.mp4

      - name: Publie l'aperçu en artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: apercu-live-face-cam
          path: apercu_live_face_cam.mp4
          retention-days: 14
